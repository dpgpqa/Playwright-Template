name: CI

on:
  push:
    branches: [template-init]
  pull_request:
    branches: [template-init]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://automationexercise.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            allure-results/
            blob-report/
            reports/
          retention-days: 7

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          DUMMYJSON_BASE_URL: https://dummyjson.com
          DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
          DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            allure-results/
            blob-report/
            reports/
          retention-days: 7

  test-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload a11y test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: |
            allure-results/
            blob-report/
            reports/
          retention-days: 7

  test-regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run regression tests
        run: npm run test:regression
        env:
          BASE_URL: https://automationexercise.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: |
            allure-results/
            blob-report/
            reports/
          retention-days: 7

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    needs: [test-smoke, test-api, test-a11y, test-regression]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download smoke test results
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-results
          path: artifacts/smoke

      - name: Download API test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: artifacts/api

      - name: Download a11y test results
        uses: actions/download-artifact@v4
        with:
          name: a11y-test-results
          path: artifacts/a11y

      - name: Download regression test results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          path: artifacts/regression

      - name: Generate Allure HTML reports
        run: |
          mkdir -p merged-reports/smoke merged-reports/api merged-reports/a11y merged-reports/regression
          
          # Generate Allure HTML report for each suite
          if [ -d "artifacts/smoke/allure-results" ] && [ "$(ls -A artifacts/smoke/allure-results)" ]; then
            echo "Generating Allure report for smoke..."
            npx allure generate artifacts/smoke/allure-results -o merged-reports/smoke --clean
          else
            echo "No allure results for smoke, creating fallback"
            echo '<html><body><h1>Smoke Tests</h1><p>No Allure report available.</p></body></html>' > merged-reports/smoke/index.html
          fi

          if [ -d "artifacts/api/allure-results" ] && [ "$(ls -A artifacts/api/allure-results)" ]; then
            echo "Generating Allure report for API..."
            npx allure generate artifacts/api/allure-results -o merged-reports/api --clean
          else
            echo "No allure results for API, creating fallback"
            echo '<html><body><h1>API Tests</h1><p>No Allure report available.</p></body></html>' > merged-reports/api/index.html
          fi

          if [ -d "artifacts/a11y/allure-results" ] && [ "$(ls -A artifacts/a11y/allure-results)" ]; then
            echo "Generating Allure report for a11y..."
            npx allure generate artifacts/a11y/allure-results -o merged-reports/a11y --clean
          else
            echo "No allure results for a11y, creating fallback"
            echo '<html><body><h1>Accessibility Tests</h1><p>No Allure report available.</p></body></html>' > merged-reports/a11y/index.html
          fi

          if [ -d "artifacts/regression/allure-results" ] && [ "$(ls -A artifacts/regression/allure-results)" ]; then
            echo "Generating Allure report for regression..."
            npx allure generate artifacts/regression/allure-results -o merged-reports/regression --clean
          else
            echo "No allure results for regression, creating fallback"
            echo '<html><body><h1>Regression Tests</h1><p>No Allure report available.</p></body></html>' > merged-reports/regression/index.html
          fi

      - name: Create index page
        run: |
          cat > merged-reports/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Test Reports</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; }
              h1 { color: #1a1a2e; }
              .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 1.5rem; margin: 1rem 0; background: #fafbfc; }
              .card h2 { margin-top: 0; color: #24292e; }
              .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; font-weight: 600; }
              .badge-smoke { background: #d4edda; color: #155724; }
              .badge-api { background: #cce5ff; color: #004085; }
              .badge-a11y { background: #e2e3e5; color: #383d41; }
              .badge-regression { background: #f8d7da; color: #721c24; }
              .links a { display: inline-block; margin-right: 1rem; padding: 0.5rem 1rem; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; }
              .links a:hover { background: #0250b5; }
              .timestamp { color: #6a737d; font-size: 0.875rem; }
            </style>
          </head>
          <body>
            <h1>📊 Playwright Test Reports</h1>
            <p class="timestamp">Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")</p>
            <p>Repository: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a> | Branch: ${{ github.ref_name }} | Commit: <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            
            <div class="card">
              <h2>📋 Test Suites</h2>
              <div class="links">
                <a href="./smoke/index.html">💨 Smoke Tests</a>
                <a href="./api/index.html">🔌 API Tests</a>
                <a href="./a11y/index.html">♿ Accessibility Tests</a>
                <a href="./regression/index.html">🔄 Regression Tests</a>
              </div>
            </div>

            <div class="card">
              <h2>📈 Latest Run</h2>
              <p><strong>Workflow:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_id }}</a></p>
              <p><strong>Commit:</strong> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            </div>
          </body>
          </html>
          EOF

      - name: Add .nojekyll
        run: touch merged-reports/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merged-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4