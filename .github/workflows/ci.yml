name: CI

on:
  push:
    branches: [template-init]
  pull_request:
    branches: [template-init]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://automationexercise.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          DUMMYJSON_BASE_URL: https://dummyjson.com
          DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
          DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  test-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test server
        run: npm run start:test-server &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          BASE_URL: http://localhost:3000

      - name: Upload a11y test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  test-regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run regression tests
        run: npm run test:regression
        env:
          BASE_URL: https://automationexercise.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  test-data-driven:
    name: Data-Driven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run data-driven tests
        run: npm run test:data-driven
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload data-driven test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-driven-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests with coverage
        run: npx nyc playwright test tests/smoke tests/api tests/regression tests/data-driven tests/quarantine --project=chromium --reporter=dot && npx nyc report --reporter=text --reporter=cobertura
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            .nyc_output/
          retention-days: 7

  test-quarantine:
    name: Quarantine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run quarantine tests
        run: npm run test:quarantine
        env:
          CI_QUARANTINE: 'true'
          BASE_URL: https://automationexercise.com

      - name: Upload quarantine test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-test-results
          path: |
            playwright-report/
            blob-report/
            reports/
          retention-days: 7

  deploy-reports:
    name: Deploy Reports to GitHub Pages
    needs: [test-smoke, test-api, test-a11y, test-regression, test-data-driven]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download smoke test results
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-results
          path: artifacts/smoke
        continue-on-error: true

      - name: Download API test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: artifacts/api
        continue-on-error: true

      - name: Download a11y test results
        uses: actions/download-artifact@v4
        with:
          name: a11y-test-results
          path: artifacts/a11y
        continue-on-error: true

      - name: Download regression test results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          path: artifacts/regression
        continue-on-error: true

      - name: Download data-driven test results
        uses: actions/download-artifact@v4
        with:
          name: data-driven-test-results
          path: artifacts/data-driven
        continue-on-error: true

      - name: Download ZAP report from ZAP workflow
        run: |
          set -x
          # Get latest successful ZAP workflow run
          ZAP_RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/zap-dast.yml/runs --jq '.workflow_runs[] | select(.conclusion=="success" and .head_branch=="template-init") | .id' | head -1)
          echo "DEBUG: ZAP_RUN_ID='$ZAP_RUN_ID'"
          if [ -n "$ZAP_RUN_ID" ]; then
            echo "Found ZAP run: $ZAP_RUN_ID"
            # Get artifact ID
            ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/$ZAP_RUN_ID/artifacts --jq '.artifacts[] | select(.name=="zap-security-report") | .id')
            echo "DEBUG: ARTIFACT_ID='$ARTIFACT_ID'"
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Downloading artifact: $ARTIFACT_ID"
              gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip --raw > zap-report.zip
              mkdir -p artifacts/zap
              unzip -o zap-report.zip -d artifacts/zap
              ls -la artifacts/zap/
            else
              echo "No zap-security-report artifact found in ZAP run $ZAP_RUN_ID"
            fi
          else
            echo "No successful ZAP run found for template-init"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Java (Required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install allure-commandline
        run: npm install --no-save allure-commandline

      - name: Copy Playwright HTML reports
        run: |
          mkdir -p merged-reports/smoke merged-reports/api merged-reports/a11y merged-reports/regression merged-reports/data-driven merged-reports/security
          cp -r artifacts/smoke/playwright-report/* merged-reports/smoke/ 2>/dev/null || \
            echo '<html><body><h1>Smoke Tests</h1><p>No report available.</p></body></html>' > merged-reports/smoke/index.html
          cp -r artifacts/api/playwright-report/* merged-reports/api/ 2>/dev/null || \
            echo '<html><body><h1>API Tests</h1><p>No report available.</p></body></html>' > merged-reports/api/index.html
          cp -r artifacts/a11y/playwright-report/* merged-reports/a11y/ 2>/dev/null || \
            echo '<html><body><h1>Accessibility Tests</h1><p>No report available.</p></body></html>' > merged-reports/a11y/index.html
          cp -r artifacts/regression/playwright-report/* merged-reports/regression/ 2>/dev/null || \
            echo '<html><body><h1>Regression Tests</h1><p>No report available.</p></body></html>' > merged-reports/regression/index.html
          cp -r artifacts/data-driven/playwright-report/* merged-reports/data-driven/ 2>/dev/null || \
                      echo '<html><body><h1>Data-Driven Tests</h1><p>No report available.</p></body></html>' > merged-reports/data-driven/index.html
                    # ZAP report: rename report_html.html to index.html
                    cp artifacts/zap/report_html.html merged-reports/security/index.html 2>/dev/null || \
                      echo '<html><body><h1>ZAP DAST Security Scan</h1><p>No report available.</p></body></html>' > merged-reports/security/index.html

      - name: Create index page
        run: |
          cat > merged-reports/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Test Reports</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; }
              h1 { color: #1a1a2e; }
              .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 1.5rem; margin: 1rem 0; background: #fafbfc; }
              .card h2 { margin-top: 0; color: #24292e; }
              .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; font-weight: 600; }
              .badge-smoke { background: #d4edda; color: #155724; }
              .badge-api { background: #cce5ff; color: #004085; }
              .badge-a11y { background: #e2e3e5; color: #383d41; }
              .badge-regression { background: #f8d7da; color: #721c24; }
              .links a { display: inline-block; margin-right: 1rem; padding: 0.5rem 1rem; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; }
              .links a:hover { background: #0250b5; }
              .timestamp { color: #6a737d; font-size: 0.875rem; }
            </style>
          </head>
          <body>
            <h1>📊 Playwright Test Reports</h1>
            <p class="timestamp">Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")</p>
            <p>Repository: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a> | Branch: ${{ github.ref_name }} | Commit: <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            
            <div class="card">
              <h2>📋 Test Suites</h2>
              <div class="links">
                <a href="./smoke/index.html">💨 Smoke Tests</a>
                <a href="./api/index.html">🔌 API Tests</a>
                <a href="./a11y/index.html">♿ Accessibility Tests</a>
                <a href="./regression/index.html">🔄 Regression Tests</a>
                <a href="./data-driven/index.html">📊 Data-Driven Tests</a>
                <a href="./security/index.html">🛡️ Security (ZAP)</a>
                <a href="./allure-full/index.html">📊 Dashboard Unificado</a>
              </div>
            </div>

            <div class="card">
              <h2>📈 Latest Run</h2>
              <p><strong>Workflow:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_id }}</a></p>
              <p><strong>Commit:</strong> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            </div>
          </body>
          </html>
          EOF

      - name: Add .nojekyll
        run: touch merged-reports/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: merged-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4