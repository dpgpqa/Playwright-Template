name: ZAP DAST Security Scan

on:
  push:
    branches: [template-init]
  pull_request:
    branches: [template-init]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

jobs:
  zap-baseline-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v1
        with:
          target: 'https://automationexercise.com'
          rules_file_name: '.zap/rules.tsv'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-a'

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-out.log
          retention-days: 7

      - name: Fail on high alerts
        if: failure()
        run: |
          echo "⚠️ ZAP baseline scan detected potential security issues. Review the zap-report.html artifact."
          exit 0
