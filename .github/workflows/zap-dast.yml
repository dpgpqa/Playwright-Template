name: ZAP DAST Security Scan

on:
  push:
    branches: [template-init]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  zap-baseline-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.4.0
        with:
          target: 'https://automationexercise.com'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-a -I'
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json
            zap-report.md
            zap-out.log
          retention-days: 7

      - name: Copy ZAP report to merged-reports
        if: always()
        run: |
          mkdir -p merged-reports/security
          cp zap-report.html merged-reports/security/zap-report.html 2>/dev/null || true
          cp zap-report.json merged-reports/security/zap-report.json 2>/dev/null || true
          cp zap-report.md merged-reports/security/zap-report.md 2>/dev/null || true

      - name: Upload ZAP report artifact for Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-pages
          path: merged-reports/security/
          retention-days: 7
