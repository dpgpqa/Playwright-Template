name: ZAP DAST Security Scan

on:
  push:
    branches: [template-init]
  pull_request:
    branches: [template-init]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

jobs:
  zap-baseline-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OWASP ZAP
        run: |
          sudo -S -p '' apt-get update -qq
          sudo -S -p '' apt-get install -y -qq zaproxy

      - name: Run ZAP Baseline Scan
        id: zap
        run: |
          set +e
          zap-baseline.py -t https://automationexercise.com -r zap-report.html -j zap-report.json -g .zap/rules.tsv -a
          ZAP_EXIT_CODE=$?
          echo "zap_exit_code=$ZAP_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $ZAP_EXIT_CODE

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json
            zap-out.log
          retention-days: 7

      - name: Fail on high alerts
        if: steps.zap.outputs.zap_exit_code != '0'
        run: |
          echo "⚠️ ZAP baseline scan detected potential security issues. Review the zap-report.html artifact."
          exit 0
