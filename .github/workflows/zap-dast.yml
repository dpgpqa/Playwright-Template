name: ZAP DAST Security Scan

on:
  push:
    branches: [template-init]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  zap-baseline-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        run: |
          chmod 777 ${{ github.workspace }}
          docker run --rm --user root \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://automationexercise.com \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a -I
          # Asegurar que el runner sea dueño de los reportes generados por root en Docker
          sudo -S -p '' chown -R $USER:$USER report_json.json report_md.md report_html.html || true

      - name: Upload ZAP Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 14
