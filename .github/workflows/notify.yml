name: CI Notifications

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  notify-on-failure:
    name: Notify on CI Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Get failed jobs
        id: failed-jobs
        run: |
          FAILED_JOBS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs --jq '.jobs[] | select(.conclusion=="failure") | .name' | tr '\n' ', ')
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Issue
        if: steps.failed-jobs.outputs.failed_jobs != ''
        run: |
          gh issue create \
            --title "🚨 CI Failure: ${{ steps.failed-jobs.outputs.branch }}" \
            --body "## CI Pipeline Failed\n\n**Branch:** ${{ steps.failed-jobs.outputs.branch }}\n**Failed jobs:** ${{ steps.failed-jobs.outputs.failed_jobs }}\n**Run:** ${{ steps.failed-jobs.outputs.run_url }}" \
            --label "ci-failure,priority-high,automated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
