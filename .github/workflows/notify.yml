name: CI Notifications

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  notify-on-failure:
    name: Notify on CI Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Get failed jobs
        id: failed-jobs
        run: |
          FAILED_JOBS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs --jq '.jobs[] | select(.conclusion=="failure") | .name' | tr '\n' ', ')
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Issue
        if: steps.failed-jobs.outputs.failed_jobs != ''
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.failed-jobs.outputs.branch }}';
            const failedJobs = '${{ steps.failed-jobs.outputs.failed_jobs }}';
            const commitSha = '${{ github.event.workflow_run.head_sha }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';
            const actor = '${{ github.event.workflow_run.actor.login }}';
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['ci-failure']
            });
            
            const existingIssue = issues.find(i => i.title.includes('CI Failure: ' + branch));
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: 'CI failed again on branch `' + branch + '`.\n\nFailed jobs: ' + failedJobs + '\nCommit: `' + commitSha + '`\nRun: ' + runUrl + '\n\n@' + actor
              });
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CI Failure: ' + branch,
              body: '## CI Pipeline Failed\n\n**Branch:** `' + branch + '`\n**Commit:** `' + commitSha + '`\n**Triggered by:** ' + actor + '\n\n**Failed Jobs:**\n' + failedJobs + '\n\n**Run:** ' + runUrl + '\n\n---\n*Auto-generated by CI Notifications workflow*',
              labels: ['ci-failure', 'priority-high', 'automated']
            });

      - name: Send Slack notification (optional)
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1
        with:
          channel: '#qa-alerts'
          status: failure
          fields: repo,commit,ref,author,job,workflow,took,message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Discord notification (optional)
        if: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **CI Failure** on \`${{ steps.failed-jobs.outputs.branch }}\`\nFailed: ${{ steps.failed-jobs.outputs.failed_jobs }}\nCommit: \`${{ steps.failed-jobs.outputs.commit_sha }}\`\n${{ steps.failed-jobs.outputs.run_url }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
