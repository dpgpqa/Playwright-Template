name: CI Notifications

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  notify-on-failure:
    name: Notify on CI Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Get failed jobs
        id: failed-jobs
        run: |
          FAILED_JOBS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs --jq '.jobs[] | select(.conclusion=="failure") | .name' | tr '\n' ', ')
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "run_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Issue for CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['ci-failure']
            });
            
            const existingIssue = issues.find(i => 
              i.title.includes(`CI Failure: ${{ steps.failed-jobs.outputs.branch }}`)
            );
            
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 CI failed again on branch \`${{ steps.failed-jobs.outputs.branch }}\`.\n\nFailed jobs: ${{ steps.failed-jobs.outputs.failed_jobs }}\nCommit: \`${{ steps.failed-jobs.outputs.commit_sha }}\`\nRun: ${{ steps.failed-jobs.outputs.run_url }}\n\n@${{ github.event.workflow_run.actor.login }}`
              });
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failure: ${{ steps.failed-jobs.outputs.branch }}`,
              body: `## CI Pipeline Failed\n\n**Branch:** \`${{ steps.failed-jobs.outputs.branch }}\`\n**Commit:** \`${{ steps.failed-jobs.outputs.commit_sha }}\`\n**Triggered by:** ${{ github.event.workflow_run.actor.login }}\n\n**Failed Jobs:**\n${{ steps.failed-jobs.outputs.failed_jobs }}\n\n**Run:** ${{ steps.failed-jobs.outputs.run_url }}\n\n---\n*Auto-generated by CI Notifications workflow*`,
              labels: ['ci-failure', 'priority-high', 'automated']
            });

      - name: Send Slack notification (optional)
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v1
        with:
          channel: '#qa-alerts'
          status: failure
          fields: repo,commit,ref,author,job,workflow,took,message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Discord notification (optional)
        if: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **CI Failure** on \`${{ steps.failed-jobs.outputs.branch }}\`\\nFailed: ${{ steps.failed-jobs.outputs.failed_jobs }}\\nCommit: \`${{ steps.failed-jobs.outputs.commit_sha }}\`\\n${{ steps.failed-jobs.outputs.run_url }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
