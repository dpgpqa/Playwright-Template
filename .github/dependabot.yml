version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      playwright-and-deps:
        patterns:
          - "playwright"
          - "@playwright/*"
      security-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated-pr"
    assignees:
      - "dpgpqa"
    reviewers:
      - "dpgpqa"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "dpgpqa"
    reviewers:
      - "dpgpqa"
