[rules]
  [[rules]]
    id = "generic-api-key"
    name = "Generic API Key"
    description = "Detects generic API keys"
    regex = """["']?(?:api[_-]?key|apikey)["']?\s*[:=]\s*["']([0-9a-zA-Z]{16,})["']"""
    secretGroup = 1

  [[rules]]
    id = "generic-secret"
    name = "Generic Secret"
    description = "Detects generic secrets"
    regex = """["']?(?:secret|token|password|passwd|pwd)["']?\s*[:=]\s*["']([0-9a-zA-Z]{16,})["']"""
    secretGroup = 1

  [[rules]]
    id = "aws-access-key"
    name = "AWS Access Key"
    description = "Detects AWS access keys"
    regex = """AKIA[0-9A-Z]{16}"""
    secretGroup = 0

  [[rules]]
    id = "github-token"
    name = "GitHub Token"
    description = "Detects GitHub personal access tokens"
    regex = """ghp_[0-9a-zA-Z]{36}"""
    secretGroup = 0

  [[rules]]
    id = "slack-token"
    name = "Slack Token"
    description = "Detects Slack tokens"
    regex = """xox[bapr]-[0-9a-zA-Z]{10,48}"""
    secretGroup = 0

  [[rules]]
    id = "private-key"
    name = "Private Key"
    description = "Detects private keys"
    regex = """-----BEGIN [A-Z ]*PRIVATE KEY-----"""
    secretGroup = 0

[allowlist]
  [[rules]]
    id = "generic-api-key"
    description = "Allow example values"
    regex = """example|test|placeholder|your-api-key-here"""
